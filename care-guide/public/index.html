<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병원 길잡이</title>
<meta name="description" content="말로 물어보면 진료과, 지금 문 연 병원·약국, 준비 서류를 쉽게 알려 드리는 어르신 병원 도우미">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor"/><path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z" fill="#fff"/></svg>
    병원 길잡이
  </h1>
  <div class="top-actions">
    <button id="font-btn" class="chip" type="button" aria-label="글자 크기 바꾸기">글자 <b>가+</b></button>
    <a class="call119" href="tel:119" aria-label="119에 전화하기">119</a>
  </div>
</header>

<div id="location-bar" class="location-bar" role="status">
  <span id="location-text">위치를 확인하고 있어요…</span>
  <button id="area-btn" class="link-btn" type="button">동네 바꾸기</button>
</div>
<div id="data-notice" class="data-notice" hidden></div>

<main id="chat" class="chat" aria-live="polite">
  <section class="welcome">
    <p class="welcome-title">어디가 불편하세요?</p>
    <p class="welcome-sub">아래 <b>마이크</b>를 누르고 편하게 말씀하세요.<br>예) "무릎이 아파요", "지금 문 연 약국 알려줘"</p>
    <div class="quick" id="quick">
      <button type="button" data-ask="지금 문 연 병원 알려줘"><span class="qi qi-hosp"></span>문 연 병원</button>
      <button type="button" data-ask="지금 문 연 약국 알려줘"><span class="qi qi-pharm"></span>문 연 약국</button>
      <button type="button" data-ask="가까운 응급실 알려줘"><span class="qi qi-er"></span>응급실</button>
      <button type="button" data-ask="대학병원 처음 갈 때 챙길 서류 알려줘"><span class="qi qi-doc"></span>큰 병원 서류</button>
      <button type="button" data-ask="실손보험 청구할 때 필요한 서류 알려줘"><span class="qi qi-ins"></span>보험 청구 서류</button>
      <button type="button" data-ask="입원했을 때 보험 청구 서류 알려줘"><span class="qi qi-bed"></span>입원·수술 보험</button>
    </div>
  </section>
</main>

<footer class="composer">
  <p id="listen-hint" class="listen-hint" hidden>듣고 있어요… 말씀이 끝나면 잠시 기다려 주세요</p>
  <div class="composer-row">
    <button id="mic-btn" class="mic" type="button" aria-label="눌러서 말하기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4.2a7.8 7.8 0 0 0 6.9 7.7V22h1.8v-2.8a7.8 7.8 0 0 0 6.9-7.7Z" fill="currentColor"/></svg>
      <span id="mic-label">말하기</span>
    </button>
    <form id="text-form" class="text-form">
      <label for="text-input" class="sr-only">글자로 물어보기</label>
      <input id="text-input" type="text" inputmode="text" autocomplete="off" placeholder="글자로 써도 돼요">
      <button type="submit" class="send">보내기</button>
    </form>
  </div>
  <label class="tts-toggle"><input id="tts-toggle" type="checkbox" checked> 답을 소리로 읽어 주기</label>
</footer>

<dialog id="area-dialog" class="area-dialog">
  <form method="dialog" id="area-form">
    <p class="dialog-title">사시는 동네를 알려 주세요</p>
    <p class="dialog-sub">예) 서울 종로구, 경기 성남시 분당구</p>
    <input id="area-input" type="text" autocomplete="off" placeholder="시·도 + 시·군·구">
    <div class="dialog-actions">
      <button value="gps" type="submit" class="ghost">내 위치 다시 찾기</button>
      <button value="save" type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script src="app.js" type="module"></script>
</body>
</html>
